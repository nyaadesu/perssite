<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- drop shadow -->
  <rect x="3" y="9" width="27" height="18" fill="#000000" opacity="0.25"/>
  <!-- envelope back/body -->
  <rect x="2" y="8" width="27" height="18" fill="#ffffff"/>
  <!-- bevel highlight (top/left) -->
  <rect x="2" y="8" width="27" height="1" fill="#ffffff"/>
  <rect x="2" y="8" width="1"  height="18" fill="#ffffff"/>
  <!-- envelope outline -->
  <rect x="2" y="8"  width="27" height="1" fill="#000000"/>
  <rect x="2" y="25" width="27" height="1" fill="#000000"/>
  <rect x="2" y="8"  width="1"  height="18" fill="#000000"/>
  <rect x="28" y="8" width="1"  height="18" fill="#000000"/>
  <!-- flap V (lines from top corners to middle) -->
  <rect x="3"  y="9"  width="1" height="1" fill="#000000"/>
  <rect x="4"  y="10" width="1" height="1" fill="#000000"/>
  <rect x="5"  y="11" width="1" height="1" fill="#000000"/>
  <rect x="6"  y="12" width="1" height="1" fill="#000000"/>
  <rect x="7"  y="13" width="1" height="1" fill="#000000"/>
  <rect x="8"  y="14" width="1" height="1" fill="#000000"/>
  <rect x="9"  y="15" width="1" height="1" fill="#000000"/>
  <rect x="10" y="16" width="1" height="1" fill="#000000"/>
  <rect x="11" y="17" width="1" height="1" fill="#000000"/>
  <rect x="12" y="18" width="1" height="1" fill="#000000"/>
  <rect x="13" y="19" width="1" height="1" fill="#000000"/>
  <rect x="14" y="20" width="1" height="1" fill="#000000"/>
  <rect x="15" y="20" width="2" height="1" fill="#000000"/>
  <rect x="17" y="19" width="1" height="1" fill="#000000"/>
  <rect x="18" y="18" width="1" height="1" fill="#000000"/>
  <rect x="19" y="17" width="1" height="1" fill="#000000"/>
  <rect x="20" y="16" width="1" height="1" fill="#000000"/>
  <rect x="21" y="15" width="1" height="1" fill="#000000"/>
  <rect x="22" y="14" width="1" height="1" fill="#000000"/>
  <rect x="23" y="13" width="1" height="1" fill="#000000"/>
  <rect x="24" y="12" width="1" height="1" fill="#000000"/>
  <rect x="25" y="11" width="1" height="1" fill="#000000"/>
  <rect x="26" y="10" width="1" height="1" fill="#000000"/>
  <rect x="27" y="9"  width="1" height="1" fill="#000000"/>
  <!-- red stamp in top-right corner of envelope back (visible above flap) -->
  <rect x="22" y="10" width="5" height="4" fill="#ff0000"/>
  <rect x="22" y="10" width="5" height="1" fill="#ffaaaa"/>
  <rect x="22" y="10" width="1" height="4" fill="#ffaaaa"/>
  <rect x="22" y="13" width="5" height="1" fill="#800000"/>
  <rect x="26" y="10" width="1" height="4" fill="#800000"/>
</svg>
